# systemd drop-in for HashiCorp units whose single-node Raft election
# outlives the default 90s start timeout (symptom: unit flaps activating/failed
# while `consul members` shows alive and the leader API answers).
#
# Install (adjust unit name):
#   mkdir -p /etc/systemd/system/consul.service.d
#   cp systemd-timeout-dropin.conf /etc/systemd/system/consul.service.d/override.conf
#   systemctl daemon-reload
#   systemctl reset-failed consul        # clear the flapping state first
#   systemctl restart --no-block consul  # NEVER block on restart; poll instead
#
# Then verify by polling, not is-active:
#   consul members                       # want: alive
#   curl -s http://127.0.0.1:8500/v1/status/leader   # want an address, not ""

[Service]
TimeoutStartSec=600
